services:
  postgres:
    image: postgres:15-alpine
    container_name: stress_ai_db
    environment:
      POSTGRES_DB: stress_ai_db
      POSTGRES_USER: stress_user
      POSTGRES_PASSWORD: stress_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stress_user -d stress_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stress_ai_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://stress_user:stress_password@postgres:5432/stress_ai_db
      SECRET_KEY: super-secret-jwt-key-change-in-production-2026
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: stress_ai_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
